name: aegis

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs `alembic upgrade head` once and exits. The API (and the checks job) wait for it to finish
  # successfully, so replicas never migrate on start.
  migrate:
    build: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      AEGIS_RUN_MIGRATIONS: "false"
      AEGIS_MIGRATION_URL: postgresql+psycopg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_APP_PASSWORD: ${AEGIS_APP_PASSWORD}
      # Needed to sign the models converted from the old pickle format (only on the first upgrade).
      AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:?AEGIS_JWT_SECRET must be set and at least 32 characters}
      AEGIS_MODEL_SIGNING_KEY: ${AEGIS_MODEL_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      AEGIS_RUN_MIGRATIONS: "false"
      # Keys held outside the database. In production (AEGIS_ENV=production) the ledger key is required:
      # without it the audit trail is tamper-evident only against partial edits.
      AEGIS_ENV: ${AEGIS_ENV:-}
      AEGIS_LEDGER_SIGNING_KEY: ${AEGIS_LEDGER_SIGNING_KEY:-}
      AEGIS_MODEL_SIGNING_KEY: ${AEGIS_MODEL_SIGNING_KEY:-}
      AEGIS_ALERT_WEBHOOK: ${AEGIS_ALERT_WEBHOOK:-}
      AEGIS_ALERT_WEBHOOK_SECRET: ${AEGIS_ALERT_WEBHOOK_SECRET:-}
      AEGIS_ALERT_EMAIL_TO: ${AEGIS_ALERT_EMAIL_TO:-}
      AEGIS_TOKEN_FAILURES_PER_MINUTE: ${AEGIS_TOKEN_FAILURES_PER_MINUTE:-10}
      # Two roles. The API runs as aegis_app, which owns nothing and cannot bypass row-level security,
      # so the database itself keeps tenants apart. The owner is used only to migrate (and to provision
      # a tenant), and the API refuses to start if it is connected as a superuser.
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis_app:${AEGIS_APP_PASSWORD:?AEGIS_APP_PASSWORD must be set (16+ characters)}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_MIGRATION_URL: postgresql+psycopg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_APP_PASSWORD: ${AEGIS_APP_PASSWORD}
      AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:?AEGIS_JWT_SECRET must be set and at least 32 characters}
      AEGIS_ANONYMISATION_SALT: ${AEGIS_ANONYMISATION_SALT:?AEGIS_ANONYMISATION_SALT must be set}
      AEGIS_MODEL_API_KEY: ${AEGIS_MODEL_API_KEY:-}
      AEGIS_MODEL_NAME: ${AEGIS_MODEL_NAME:-}
      AEGIS_MODEL_BASE_URL: ${AEGIS_MODEL_BASE_URL:-}
      AEGIS_SMTP_HOST: ${AEGIS_SMTP_HOST:-}
      AEGIS_SMTP_PORT: ${AEGIS_SMTP_PORT:-587}
      AEGIS_SMTP_USERNAME: ${AEGIS_SMTP_USERNAME:-}
      AEGIS_SMTP_PASSWORD: ${AEGIS_SMTP_PASSWORD:-}
      # Only `make demo` sets this; without it the demo seeder refuses to run.
      AEGIS_ALLOW_DEMO_SEED: ${AEGIS_ALLOW_DEMO_SEED:-false}
    ports:
      - "${AEGIS_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Scheduled checks and alert delivery: ledger integrity, drift of recently scored inputs against the
  # active model's reference, retrain due. Off the API so replicas stay stateless. Run once with
  # `docker compose run --rm checks python -m aegis.ops --once`.
  checks:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "aegis.ops"]
    environment:
      AEGIS_RUN_MIGRATIONS: "false"
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis_app:${AEGIS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      # The owner connection is used only to list tenant ids; the checks themselves run as aegis_app.
      AEGIS_ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET}
      AEGIS_MODEL_SIGNING_KEY: ${AEGIS_MODEL_SIGNING_KEY:-}
      AEGIS_ENV: ${AEGIS_ENV:-}
      AEGIS_LEDGER_SIGNING_KEY: ${AEGIS_LEDGER_SIGNING_KEY:-}
      AEGIS_CHECK_INTERVAL_SECONDS: ${AEGIS_CHECK_INTERVAL_SECONDS:-900}
      AEGIS_ALERT_WEBHOOK: ${AEGIS_ALERT_WEBHOOK:-}
      AEGIS_ALERT_WEBHOOK_SECRET: ${AEGIS_ALERT_WEBHOOK_SECRET:-}
      AEGIS_ALERT_EMAIL_TO: ${AEGIS_ALERT_EMAIL_TO:-}
      AEGIS_SMTP_HOST: ${AEGIS_SMTP_HOST:-}
      AEGIS_SMTP_PORT: ${AEGIS_SMTP_PORT:-587}
      AEGIS_SMTP_USERNAME: ${AEGIS_SMTP_USERNAME:-}
      AEGIS_SMTP_PASSWORD: ${AEGIS_SMTP_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  console:
    build: ./apps/console
    restart: unless-stopped
    environment:
      AEGIS_API_URL: http://api:8000
      # Set to false only to sign in over plain http from a host other than localhost.
      AEGIS_COOKIE_SECURE: ${AEGIS_COOKIE_SECURE:-true}
    ports:
      - "${AEGIS_CONSOLE_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
