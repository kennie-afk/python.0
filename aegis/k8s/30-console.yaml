apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: aegis
  labels: {app.kubernetes.io/name: console, app.kubernetes.io/part-of: aegis}
spec:
  selector: {app.kubernetes.io/name: console}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: aegis
  labels: {app.kubernetes.io/name: console, app.kubernetes.io/part-of: aegis}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: console}
  template:
    metadata:
      labels: {app.kubernetes.io/name: console, app.kubernetes.io/part-of: aegis}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: console}
      containers:
        - name: console
          image: aegis-console:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: AEGIS_API_URL, value: "http://api:8000"}
            # Which tenant the public /welcome storefront shows (a slug from `select slug from tenants`). Optional.
            - {name: STOREFRONT_TENANT_SLUG, value: ""}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: cache, mountPath: /app/.next/cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: console
  namespace: aegis
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: console}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console
  namespace: aegis
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: console}
