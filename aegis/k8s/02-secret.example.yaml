# NOT applied by kustomize. Shows the keys the workloads read. Create the real Secret with scripts/k8s-secret.sh, which
# generates random values and never writes them to a file:  ./scripts/k8s-secret.sh | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  AEGIS_DB_OWNER_PASSWORD: CHANGE-ME
  AEGIS_APP_PASSWORD: CHANGE-ME-16-OR-MORE-SAFE-CHARACTERS
  AEGIS_JWT_SECRET: CHANGE-ME-32-OR-MORE-RANDOM-CHARACTERS
  AEGIS_ANONYMISATION_SALT: CHANGE-ME-AND-NEVER-ROTATE-IT
  # Signs every audit-trail entry and the ledger head. Required (AEGIS_ENV=production); keep it out of the database.
  AEGIS_LEDGER_SIGNING_KEY: CHANGE-ME-32-OR-MORE-RANDOM-CHARACTERS
  # Optional:
  # AEGIS_MODEL_API_KEY: ...
  # AEGIS_SMTP_PASSWORD: ...
  # AEGIS_MODEL_SIGNING_KEY: ...   (signs trained models; defaults to a key derived from AEGIS_JWT_SECRET)
  # AEGIS_ALERT_WEBHOOK: https://...
