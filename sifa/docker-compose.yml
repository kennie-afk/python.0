services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SIFA_USERS: "240"
      SIFA_ITEMS: "600"

  console:
    build:
      context: ./apps/console
    ports:
      - "3200:3200"
    environment:
      SIFA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
