services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${SIFA_API_PORT:-8000}:8000"
    environment:
      SIFA_USERS: "240"
      SIFA_ITEMS: "600"
      SIFA_API_KEYS: ${SIFA_API_KEYS:?SIFA_API_KEYS must be set to one or more keys of at least 24 characters}
      SIFA_CORS_ORIGINS: ${SIFA_CORS_ORIGINS:-}
      # Demo only: serve this many feeds at start-up and record a release history (about 11 ms each).
      SIFA_DEMO_WARMUP: ${SIFA_DEMO_WARMUP:-0}

  console:
    build:
      context: ./apps/console
    restart: unless-stopped
    ports:
      - "${SIFA_CONSOLE_PORT:-3200}:3200"
    environment:
      SIFA_API_URL: http://api:8000
      SIFA_API_KEY: ${SIFA_API_KEYS:?SIFA_API_KEYS must be set to one or more keys of at least 24 characters}
    depends_on:
      api:
        condition: service_healthy
