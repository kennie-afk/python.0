name: aegis

on:
  push:
    branches: [main]
    paths: ["aegis/**", ".github/workflows/aegis.yml"]
  pull_request:
    paths: ["aegis/**", ".github/workflows/aegis.yml"]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ownerpw
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      # The row-level-security and migration tests skip when no database answers. In CI a skip would hide a
      # broken tenant boundary, so fail the build if any of them was skipped.
      - name: Row-level security tests must run, not skip
        run: |
          set -o pipefail
          uv run pytest tests/persistence/test_row_level_security.py tests/persistence/test_governance_migration.py -q -rs | tee rls.txt
          ! grep -q SKIPPED rls.txt

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis/apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aegis/apps/console/package-lock.json
      - run: npm ci
      - run: npm run build
